# Main CI: lint, secret scan, SCA, SAST (Semgrep), build + test against real
# Mongo/Elasticsearch service containers. All gates are fail-closed.
# Third-party actions are pinned to full commit SHAs (version in comment).
name: ci

on:
  pull_request:
  push:
    branches: [main]

# Default token is read-only; jobs that need more declare it themselves.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Type-aware linting of api-demo resolves @devox/engine through its
      # compiled dist/, so the engine must build first (same constraint as
      # the api-demo build itself).
      - run: npm run build -w packages/engine
      - run: npm run lint
      - run: npm run format:check

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so leaked-then-deleted secrets are still caught.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sca:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      # Gate: no high/critical advisories in production dependencies.
      - run: npm audit --omit=dev --audit-level=high
      # Report-only: full picture including devDependencies.
      - run: npm audit --audit-level=info || true

  osv-scan:
    permissions:
      actions: read
      contents: read
      security-events: write
    # Defaults: recursive scan of the repo (finds package-lock.json),
    # fails the job on any known vulnerability, uploads SARIF.
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@8deb546fdb875b9996d27d4950be7312dac076a1 # v2.5.0

  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep:1.171.0@sha256:bdf7013b2c3634a487671158da77c554f531742326b543a9464d2adf6c433ac8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: semgrep scan --config p/typescript --config p/owasp-top-ten --config .semgrep/custom-rules.yml --error --metrics=off

  build-test:
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Unreachable Mongo/ES must fail the integration suites, never
      # let them self-skip into a vacuous green build.
      DEVOX_REQUIRE_SERVICES: '1'
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
        env:
          discovery.type: single-node
          xpack.security.enabled: 'false'
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -fs http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 30s
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # api-demo consumes the engine's compiled dist/, so order matters.
      - run: npm run build -w packages/engine
      - run: npm run build -w packages/api-demo
      - run: npm run build -w packages/dashboard
      - run: npm test
      - run: npm run test:e2e -w packages/api-demo
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: engine-coverage
          path: packages/engine/coverage
          retention-days: 14

  docker:
    needs: [build-test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -f packages/api-demo/Dockerfile -t devoxguard-api-demo:ci .
      - run: docker build -f packages/dashboard/Dockerfile -t devoxguard-dashboard:ci .
      # Image scans: fail on fixable HIGH/CRITICAL vulnerabilities.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: devoxguard-api-demo:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: devoxguard-dashboard:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      # IaC/config scan: Dockerfiles, docker-compose, workflow files.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
