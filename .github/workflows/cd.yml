# Continuous deployment. Runs after a release publishes signed GHCR images
# (release.yml) — or on demand — and, before anything is deployed:
#   1. verifies each image's Cosign signature against the release workflow's
#      OIDC identity (proves it came from our pipeline, not a look-alike),
#   2. re-scans the pulled image with Trivy (a vuln gate at deploy time, not
#      just build time),
#   3. brings the stack up on a disposable runner target and smoke-tests it —
#      health, a benign request, and an injection payload that MUST be blocked
#      (403), proving detection survives the real deploy artifact.
# The actual SSH deploy is dormant until a target is configured (see the
# `deploy` job) so this workflow is target-agnostic and safe to run today.
name: cd

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to deploy (e.g. 0.2.0, or latest)
        required: true
        default: latest
      environment:
        description: Target environment
        required: true
        default: production

permissions:
  contents: read

concurrency:
  group: cd-${{ github.event.inputs.environment || 'production' }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/devoxguard-api-demo
  DASH_IMAGE: ghcr.io/${{ github.repository_owner }}/devoxguard-dashboard

jobs:
  verify-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read # pull the published images
      id-token: write # (reserved) OIDC, if verification is extended to keyed flows
    outputs:
      api_ref: ${{ steps.digests.outputs.api_ref }}
      dash_ref: ${{ steps.digests.outputs.dash_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve image tag
        id: tag
        # Read event data via env, never interpolated into the script body — a
        # release name is attacker-influenceable and must not reach the shell.
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ github.event.inputs.image_tag }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            TAG="${RELEASE_TAG#v}"   # release.yml publishes semver tags without the leading v
          else
            TAG="$INPUT_TAG"
          fi
          # Constrain to a sane image-tag charset before it's used anywhere.
          case "$TAG" in
            *[!A-Za-z0-9._-]*) echo "Refusing suspicious tag: $TAG"; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Deploying tag: $TAG"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Resolve each tag to an immutable digest so verify/scan/deploy all
      # reference the exact same bytes.
      - name: Resolve digests
        id: digests
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          API_DIGEST=$(docker buildx imagetools inspect "${API_IMAGE}:${TAG}" --format '{{ .Manifest.Digest }}')
          DASH_DIGEST=$(docker buildx imagetools inspect "${DASH_IMAGE}:${TAG}" --format '{{ .Manifest.Digest }}')
          echo "api_ref=${API_IMAGE}@${API_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "dash_ref=${DASH_IMAGE}@${DASH_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "api  -> ${API_IMAGE}@${API_DIGEST}"
          echo "dash -> ${DASH_IMAGE}@${DASH_DIGEST}"

      # ---- Gate 1: signature verification (keyless, release workflow's identity) ----
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Verify Cosign signatures
        env:
          API_REF: ${{ steps.digests.outputs.api_ref }}
          DASH_REF: ${{ steps.digests.outputs.dash_ref }}
          IDENTITY_RE: ^https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/tags/
        run: |
          set -euo pipefail
          for REF in "$API_REF" "$DASH_REF"; do
            echo "Verifying $REF"
            cosign verify \
              --certificate-identity-regexp "$IDENTITY_RE" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$REF" > /dev/null
          done
          echo "Both images verified as built + signed by release.yml."

      # ---- Gate 2: fresh vulnerability scan of the exact artifact being deployed ----
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          scan-type: image
          image-ref: ${{ steps.digests.outputs.api_ref }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: security/trivy/trivyignore
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          scan-type: image
          image-ref: ${{ steps.digests.outputs.dash_ref }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: security/trivy/trivyignore

      # ---- Gate 3: deploy to a disposable target and smoke-test it ----
      # Brings up the data services + the pulled api-demo image (dashboard/caddy
      # are skipped here — they need real DNS/TLS for ACME). Proves the deployed
      # artifact is healthy, serves benign traffic, and still blocks injection.
      - name: Smoke test the deployed artifact
        env:
          API_IMAGE: ${{ steps.digests.outputs.api_ref }}
          DASH_IMAGE: ${{ steps.digests.outputs.dash_ref }}
        run: |
          set -euo pipefail
          # Minimal production .env (prod mode refuses to boot on the dev key).
          cp .env.example .env
          {
            echo "DEVOXGUARD_API_KEY=$(openssl rand -hex 32)"
          } >> .env

          docker compose -f docker-compose.prod.yml -f docker-compose.deploy.yml up -d mongo elasticsearch api-demo

          echo "Waiting for api-demo health..."
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/devoxguard/health > /dev/null; then ok=1; break; fi
            sleep 3
          done
          [ "${ok:-}" = "1" ] || { echo "api-demo never became healthy"; docker compose -f docker-compose.prod.yml -f docker-compose.deploy.yml logs api-demo; exit 1; }

          benign=$(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:3000/products/search?q=keyboard')
          sqli=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3000/products/search?q=%27%20OR%20%271%27=%271")
          nosqli=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' \
            --data '{"email":"admin@corp.test","password":{"$ne":""}}' http://127.0.0.1:3000/account/login)

          echo "benign=$benign sqli=$sqli nosqli=$nosqli"
          [ "$benign" = "200" ] || { echo "benign request should be 200"; exit 1; }
          [ "$sqli" = "403" ]   || { echo "SQLi should be blocked (403)"; exit 1; }
          [ "$nosqli" = "403" ] || { echo "NoSQLi should be blocked (403)"; exit 1; }
          echo "Smoke test passed: healthy, benign allowed, injection blocked."

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.prod.yml -f docker-compose.deploy.yml down -v || true

  deploy:
    needs: [verify-and-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # GitHub Environment: add required reviewers / protection rules here to gate
    # production deploys. Secrets below live on this environment.
    environment: ${{ github.event.inputs.environment || 'production' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Dormant until a target is configured. Set the repo/environment variable
      # DEPLOY_ENABLED=true and provide DEPLOY_HOST / DEPLOY_USER /
      # DEPLOY_SSH_KEY (and optionally DEPLOY_KNOWN_HOSTS) secrets to activate.
      # Until then this step is skipped, keeping the workflow target-agnostic.
      - name: Deploy over SSH (pull-based, digest-pinned)
        if: ${{ vars.DEPLOY_ENABLED == 'true' }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          API_REF: ${{ needs.verify-and-smoke.outputs.api_ref }}
          DASH_REF: ${{ needs.verify-and-smoke.outputs.dash_ref }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "${DEPLOY_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts   # pinned host key (preferred)
          else
            ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null # TOFU fallback
          fi
          # Deploy dir on the VM is expected to hold the compose files + .env
          # (provision it with the Ansible playbook — see ansible/). We only
          # hand it the verified, digest-pinned image refs to pull and run.
          ssh -i ~/.ssh/id_deploy "$DEPLOY_USER@$DEPLOY_HOST" bash -s <<EOF
          set -euo pipefail
          cd /opt/devoxguard
          export API_IMAGE='$API_REF' DASH_IMAGE='$DASH_REF'
          docker compose -f docker-compose.prod.yml -f docker-compose.deploy.yml pull
          docker compose -f docker-compose.prod.yml -f docker-compose.deploy.yml up -d
          docker compose -f docker-compose.prod.yml -f docker-compose.deploy.yml ps
          EOF

      - name: Deployment target not configured
        if: ${{ vars.DEPLOY_ENABLED != 'true' }}
        run: |
          echo "No deployment target configured (DEPLOY_ENABLED != 'true')."
          echo "Verified + smoke-tested images are ready to deploy:"
          echo "  api-demo:  ${{ needs.verify-and-smoke.outputs.api_ref }}"
          echo "  dashboard: ${{ needs.verify-and-smoke.outputs.dash_ref }}"
          echo "Configure a VM with ansible/ and set DEPLOY_ENABLED=true + the DEPLOY_* secrets to activate."
