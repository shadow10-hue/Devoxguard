# Release supply chain: build both images, gate on Trivy BEFORE pushing,
# push to GHCR, sign keyless with Cosign (GitHub OIDC), attach SLSA build
# provenance, generate SBOMs (SPDX + CycloneDX) and publish them on the
# GitHub Release.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/devoxguard-api-demo
  DASH_IMAGE: ghcr.io/${{ github.repository_owner }}/devoxguard-dashboard

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # create the GitHub Release + upload SBOM assets
      packages: write # push images to GHCR
      id-token: write # Cosign keyless signing via GitHub OIDC
      attestations: write # SLSA build provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---- Build locally and gate on Trivy before anything is published ----
      - run: docker build -f packages/api-demo/Dockerfile -t api-demo:scan .
      - run: docker build -f packages/dashboard/Dockerfile -t dashboard:scan .
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: api-demo:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: dashboard:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      # ---- Push (layer cache from the scan builds) ----
      - id: meta-api
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.API_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - id: meta-dash
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.DASH_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - id: push-api
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: packages/api-demo/Dockerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
      - id: push-dash
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: packages/dashboard/Dockerfile
          push: true
          tags: ${{ steps.meta-dash.outputs.tags }}
          labels: ${{ steps.meta-dash.outputs.labels }}

      # ---- Sign + provenance (keyless: identity is this workflow's OIDC) ----
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - run: cosign sign --yes ${{ env.API_IMAGE }}@${{ steps.push-api.outputs.digest }}
      - run: cosign sign --yes ${{ env.DASH_IMAGE }}@${{ steps.push-dash.outputs.digest }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.API_IMAGE }}
          subject-digest: ${{ steps.push-api.outputs.digest }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.DASH_IMAGE }}
          subject-digest: ${{ steps.push-dash.outputs.digest }}
          push-to-registry: true

      # ---- SBOMs (Syft via anchore/sbom-action), both SPDX and CycloneDX ----
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.API_IMAGE }}@${{ steps.push-api.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: devoxguard-api-demo.spdx.json
          upload-release-assets: false
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.API_IMAGE }}@${{ steps.push-api.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: cyclonedx-json
          output-file: devoxguard-api-demo.cdx.json
          upload-release-assets: false
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.DASH_IMAGE }}@${{ steps.push-dash.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: devoxguard-dashboard.spdx.json
          upload-release-assets: false
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.DASH_IMAGE }}@${{ steps.push-dash.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: cyclonedx-json
          output-file: devoxguard-dashboard.cdx.json
          upload-release-assets: false

      # ---- GitHub Release with SBOM assets ----
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          files: |
            devoxguard-api-demo.spdx.json
            devoxguard-api-demo.cdx.json
            devoxguard-dashboard.spdx.json
            devoxguard-dashboard.cdx.json
