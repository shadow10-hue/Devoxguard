# DAST: OWASP ZAP baseline scan against a real running api-demo (backed by
# a real MongoDB — the engine is fail-closed on Mongo at startup).
# Alerts not explicitly ignored in security/zap/rules.tsv fail the job.
name: dast

on:
  workflow_dispatch:
  schedule:
    - cron: '41 6 * * 1' # Mondays 06:41 UTC
  pull_request:
    paths:
      - 'packages/api-demo/**'
      - 'packages/engine/**'
      - 'security/zap/**'
      - '.github/workflows/dast.yml'

permissions:
  contents: read

concurrency:
  group: dast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zap-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build -w packages/engine
      - run: npm run build -w packages/api-demo
      - name: Start api-demo
        run: |
          node packages/api-demo/dist/main.js &
          echo $! > server.pid
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/ || true)
            if [ "$code" != "000" ]; then echo "up (HTTP $code)"; exit 0; fi
            sleep 2
          done
          echo "server never came up"; exit 1
        env:
          DEVOXGUARD_MONGO_URI: mongodb://localhost:27017
      - uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: http://localhost:3000
          rules_file_name: security/zap/rules.tsv
          # Strict gate: any non-ignored alert fails the job; never open
          # GitHub issues from a scanner.
          fail_action: true
          allow_issue_writing: false
          artifact_name: zap-baseline-report
