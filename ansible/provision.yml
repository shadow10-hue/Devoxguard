---
# One-time host provisioning for the DevoxGuard single-VM deployment.
# Installs Docker, hardens the host (firewall, fail2ban, automatic security
# updates, a non-root deploy user, Docker daemon hardening + log rotation), and
# prepares the deploy directory. Idempotent — safe to re-run.
#
#   ansible-playbook provision.yml
#
# Requires a bootstrap user with passwordless (or --ask-become-pass) sudo.
- name: Provision DevoxGuard host
  hosts: devoxguard
  become: true
  vars:
    deploy_user: deploy
    deploy_dir: /opt/devoxguard
    docker_apt_arch: amd64

  tasks:
    - name: Install base packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - ufw
          - fail2ban
          - unattended-upgrades
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create Docker apt keyring dir
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Add Docker GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add Docker apt repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ docker_apt_arch }} signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
        filename: docker
        state: present

    - name: Install Docker Engine + Compose plugin
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Harden the Docker daemon (log rotation, no-new-privileges, live-restore)
      ansible.builtin.copy:
        # Bounds container log growth (a noisy/attacked service can't fill the
        # disk) and applies no-new-privileges by default across all containers.
        content: |
          {
            "log-driver": "json-file",
            "log-opts": { "max-size": "10m", "max-file": "3" },
            "no-new-privileges": true,
            "live-restore": true
          }
        dest: /etc/docker/daemon.json
        mode: "0644"
      notify: Restart docker

    - name: Enable and start Docker
      ansible.builtin.service:
        name: docker
        enabled: true
        state: started

    - name: Create the non-root deploy user
      ansible.builtin.user:
        name: "{{ deploy_user }}"
        groups: docker
        append: true
        shell: /bin/bash
        create_home: true

    - name: Create the deploy directory
      ansible.builtin.file:
        path: "{{ deploy_dir }}"
        state: directory
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0750"

    - name: UFW default deny incoming
      community.general.ufw:
        direction: incoming
        policy: deny

    - name: UFW default allow outgoing
      community.general.ufw:
        direction: outgoing
        policy: allow

    - name: UFW allow SSH, HTTP, HTTPS
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop:
        - "22"
        - "80"
        - "443"

    - name: Enable UFW
      community.general.ufw:
        state: enabled

    - name: Enable and start fail2ban
      ansible.builtin.service:
        name: fail2ban
        enabled: true
        state: started

    - name: Enable unattended security upgrades
      ansible.builtin.copy:
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        mode: "0644"

  handlers:
    - name: Restart docker
      ansible.builtin.service:
        name: docker
        state: restarted
