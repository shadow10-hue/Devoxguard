# Hardened static serving for the DevoxGuard dashboard SPA.
server {
    listen 8080;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    # connect-src stays open because the API origin differs per deployment;
    # script/style/img sources are locked to the bundle itself.
    add_header Content-Security-Policy "default-src 'self'; connect-src *; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'" always;

    # vue-router history mode: unknown paths fall back to the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
